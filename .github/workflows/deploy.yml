name: Deploy Gas Town to Hetzner

on:
  workflow_dispatch:
    inputs:
      server_name:
        description: 'Server name (will be your Tailscale hostname)'
        required: true
        default: 'gastown'
        type: string
      server_type:
        description: 'Server type'
        required: true
        default: 'cx22'
        type: choice
        options:
          - cx22   # 2 vCPU, 4GB RAM, 40GB - ~$4/mo
          - cx32   # 4 vCPU, 8GB RAM, 80GB - ~$8/mo
          - cx42   # 8 vCPU, 16GB RAM, 160GB - ~$16/mo
      location:
        description: 'Server location'
        required: true
        default: 'nbg1'
        type: choice
        options:
          - nbg1   # Nuremberg, Germany
          - fsn1   # Falkenstein, Germany
          - hel1   # Helsinki, Finland
          - ash    # Ashburn, USA

env:
  HCLOUD_TOKEN: ${{ secrets.HETZNER_TOKEN }}

jobs:
  deploy:
    name: Deploy VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.HETZNER_TOKEN }}" ]; then
            echo "::error::HETZNER_TOKEN secret is not set"
            echo ""
            echo "To fix this:"
            echo "1. Go to your fork's Settings → Secrets and variables → Actions"
            echo "2. Click 'New repository secret'"
            echo "3. Name: HETZNER_TOKEN"
            echo "4. Value: Your Hetzner API token from console.hetzner.cloud"
            exit 1
          fi

          if [ -z "${{ secrets.TAILSCALE_KEY }}" ]; then
            echo "::error::TAILSCALE_KEY secret is not set"
            echo ""
            echo "To fix this:"
            echo "1. Go to your fork's Settings → Secrets and variables → Actions"
            echo "2. Click 'New repository secret'"
            echo "3. Name: TAILSCALE_KEY"
            echo "4. Value: Your Tailscale auth key from tailscale.com/admin/settings/keys"
            echo "   (Use a reusable key, or an ephemeral key for one-time setup)"
            exit 1
          fi

          echo "✓ All required secrets are configured"

      - name: Install hcloud CLI
        run: |
          curl -fsSL https://github.com/hetznercloud/cli/releases/latest/download/hcloud-linux-amd64.tar.gz -o hcloud.tar.gz
          tar -xzf hcloud.tar.gz
          sudo mv hcloud /usr/local/bin/
          hcloud version

      - name: Check if server already exists
        id: check_server
        run: |
          if hcloud server describe "${{ inputs.server_name }}" &> /dev/null; then
            echo "::error::Server '${{ inputs.server_name }}' already exists!"
            echo ""
            echo "To delete the existing server:"
            echo "  hcloud server delete ${{ inputs.server_name }}"
            echo ""
            echo "Or use a different server name."
            exit 1
          fi
          echo "✓ Server name is available"

      - name: Generate cloud-init config
        run: |
          cat > /tmp/cloud-init.yml << 'CLOUD_INIT_EOF'
          #cloud-config

          users:
            - name: gastown
              groups: sudo
              shell: /bin/bash
              sudo: ALL=(ALL) NOPASSWD:ALL
              ssh_authorized_keys:
                - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPlaceholder_Tailscale_SSH_Is_Primary

          package_update: true
          package_upgrade: true

          packages:
            - curl
            - git
            - tmux
            - jq
            - unzip
            - ca-certificates
            - gnupg
            - build-essential
            - ripgrep
            - htop

          write_files:
            - path: /etc/motd
              content: |

                 ╔═══════════════════════════════════════════════════════════╗
                 ║                    GAS TOWN REMOTE                        ║
                 ║                                                           ║
                 ║  Deployed via GitHub Actions                              ║
                 ║  Connect: ssh gastown@${{ inputs.server_name }}           ║
                 ╚═══════════════════════════════════════════════════════════╝

            - path: /home/gastown/.hushlogin
              content: ""

          runcmd:
            # Install Tailscale
            - curl -fsSL https://tailscale.com/install.sh | sh

            # Authenticate Tailscale
            - tailscale up --auth-key=${{ secrets.TAILSCALE_KEY }} --ssh --hostname=${{ inputs.server_name }}

            # Install Node.js
            - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
            - apt-get install -y nodejs

            # Install Go
            - curl -fsSL "https://go.dev/dl/go1.23.4.linux-amd64.tar.gz" -o /tmp/go.tar.gz
            - rm -rf /usr/local/go && tar -C /usr/local -xzf /tmp/go.tar.gz
            - rm /tmp/go.tar.gz

            # Install GitHub CLI
            - curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            - chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            - echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            - apt-get update && apt-get install -y gh

            # Install Claude Code
            - npm install -g @anthropic-ai/claude-code

            # Install Gas Town (gt and bd)
            - su - gastown -c "export PATH=\$PATH:/usr/local/go/bin && go install github.com/steveyegge/gastown/cmd/gt@latest" || true
            - su - gastown -c "export PATH=\$PATH:/usr/local/go/bin && go install github.com/steveyegge/beads/cmd/bd@latest" || true

            # Configure shell for gastown user
            - |
              cat >> /home/gastown/.bashrc << 'BASHRC_EOF'

              # gastown-remote
              export PATH="$PATH:/usr/local/go/bin:$HOME/go/bin"

              # Auto-attach to tmux on SSH login
              if [[ -z "$TMUX" ]] && [[ -n "$SSH_CONNECTION" ]] && [[ $- == *i* ]]; then
                  tmux attach -t main 2>/dev/null || tmux new -s main
              fi
              BASHRC_EOF

            # Configure tmux
            - |
              cat > /home/gastown/.tmux.conf << 'TMUX_EOF'
              set -g prefix C-a
              unbind C-b
              bind C-a send-prefix
              set -g mouse on
              set -g base-index 1
              setw -g pane-base-index 1
              set -g history-limit 50000
              set -s escape-time 0
              setw -g monitor-activity on
              set -g visual-activity off
              set -g status-style 'bg=#333333 fg=#ffffff'
              set -g status-left '[#S] '
              set -g status-right '%H:%M '
              bind r source-file ~/.tmux.conf \; display "Reloaded!"
              bind | split-window -h
              bind - split-window -v
              TMUX_EOF

            # Fix ownership
            - chown -R gastown:gastown /home/gastown

            # Create systemd service for tmux
            - |
              cat > /etc/systemd/system/gastown-tmux.service << 'SYSTEMD_EOF'
              [Unit]
              Description=Gas Town tmux session
              After=network.target

              [Service]
              Type=forking
              User=gastown
              ExecStart=/usr/bin/tmux new-session -d -s main
              ExecStop=/usr/bin/tmux kill-session -t main
              RemainAfterExit=yes
              Restart=on-failure
              RestartSec=5

              [Install]
              WantedBy=multi-user.target
              SYSTEMD_EOF

            - systemctl daemon-reload
            - systemctl enable gastown-tmux.service
            - systemctl start gastown-tmux.service

          final_message: "Gas Town Remote is ready! Connect via: ssh gastown@${{ inputs.server_name }}"
          CLOUD_INIT_EOF

          echo "✓ Cloud-init config generated"

      - name: Create Hetzner server
        id: create_server
        run: |
          echo "Creating server '${{ inputs.server_name }}'..."
          echo "  Type: ${{ inputs.server_type }}"
          echo "  Location: ${{ inputs.location }}"
          echo ""

          hcloud server create \
            --name "${{ inputs.server_name }}" \
            --type "${{ inputs.server_type }}" \
            --location "${{ inputs.location }}" \
            --image ubuntu-24.04 \
            --user-data-from-file /tmp/cloud-init.yml

          # Get server IP
          SERVER_IP=$(hcloud server ip "${{ inputs.server_name }}")
          echo "server_ip=$SERVER_IP" >> $GITHUB_OUTPUT
          echo ""
          echo "✓ Server created: $SERVER_IP"

      - name: Wait for cloud-init
        run: |
          echo "Waiting for cloud-init to complete (this takes 2-4 minutes)..."
          echo "The server is installing: Tailscale, Node.js, Go, Claude Code, Gas Town"
          echo ""

          # Wait for Tailscale to come online (poll every 15 seconds for 5 minutes)
          for i in {1..20}; do
            sleep 15
            echo "Checking... ($((i * 15))s elapsed)"
          done

          echo ""
          echo "✓ Cloud-init should be complete"

      - name: Print success message
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "  GAS TOWN REMOTE - DEPLOYMENT COMPLETE!"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""
          echo "  Server Details:"
          echo "    Name:       ${{ inputs.server_name }}"
          echo "    Public IP:  ${{ steps.create_server.outputs.server_ip }}"
          echo "    Type:       ${{ inputs.server_type }}"
          echo "    Location:   ${{ inputs.location }}"
          echo ""
          echo "  Connect via Tailscale SSH:"
          echo "    ssh gastown@${{ inputs.server_name }}"
          echo ""
          echo "  First-time setup (run after connecting):"
          echo "    1. claude → /login  (authenticate Claude Code)"
          echo "    2. gh auth login    (authenticate GitHub)"
          echo "    3. gt install ~/gt  (initialize Gas Town)"
          echo ""
          echo "  Monthly cost: ~\$4-8 depending on server type"
          echo ""
          echo "═══════════════════════════════════════════════════════════════"

      - name: Create summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          # 🏭 Gas Town Deployed!

          ## Server Details
          | Property | Value |
          |----------|-------|
          | Name | `${{ inputs.server_name }}` |
          | IP | `${{ steps.create_server.outputs.server_ip }}` |
          | Type | `${{ inputs.server_type }}` |
          | Location | `${{ inputs.location }}` |

          ## Connect
          ```bash
          ssh gastown@${{ inputs.server_name }}
          ```

          ## First-Time Setup
          1. `claude` → `/login` (authenticate)
          2. `gh auth login`
          3. `gt install ~/gt`

          ## Need Help?
          See the [README](https://github.com/${{ github.repository }}) for troubleshooting.
          EOF
