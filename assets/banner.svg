<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a09"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="fuelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="140" rx="20" fill="url(#bgGrad)"/>

  <!-- Decorative elements -->
  <circle cx="540" cy="30" r="40" fill="#f59e0b" opacity="0.08"/>
  <circle cx="560" cy="110" r="25" fill="#06b6d4" opacity="0.06"/>
  <circle cx="50" cy="120" r="30" fill="#ea580c" opacity="0.05"/>

  <!-- Fuel pump icon -->
  <g transform="translate(40, 35)" filter="url(#glow)">
    <!-- Pump body -->
    <rect x="8" y="20" width="32" height="40" rx="4" fill="url(#fuelGrad)"/>
    <!-- Pump top -->
    <rect x="12" y="8" width="24" height="16" rx="2" fill="url(#fuelGrad)"/>
    <!-- Display -->
    <rect x="14" y="28" width="20" height="12" rx="2" fill="#0c0a09"/>
    <!-- Nozzle -->
    <path d="M40 30 Q55 30 55 45 L55 55" stroke="url(#fuelGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Nozzle tip -->
    <circle cx="55" cy="58" r="4" fill="url(#fuelGrad)"/>
    <!-- Base -->
    <rect x="4" y="56" width="40" height="8" rx="2" fill="url(#fuelGrad)"/>
  </g>

  <!-- Cloud icon (representing remote/cloud) -->
  <g transform="translate(505, 45)" opacity="0.9">
    <path d="M40 35 C40 28 35 23 28 23 C27 17 22 12 15 12 C7 12 0 19 0 28 C0 28 0 28 0 28 C-3 28 -5 31 -5 35 C-5 39 -2 42 2 42 L38 42 C42 42 45 39 45 35 C45 31 42 28 38 28 C39 28 40 31 40 35 Z" fill="url(#cloudGrad)"/>
  </g>

  <!-- Main text -->
  <text x="115" y="85" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="white" letter-spacing="-1">
    gastown
  </text>
  <text x="335" y="85" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="300" fill="#a8a29e" letter-spacing="-1">
    remote
  </text>

  <!-- Tagline -->
  <text x="115" y="112" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#78716c" letter-spacing="0.5">
    AI agents in the cloud. Access from anywhere.
  </text>
</svg>
